<html>
  <head>
    <title>Welcome to Travel Websitr</title>
    <link rel="stylesheet" href="style.css">
    <style>
      body{
        background-image:linear-gradient (rgba(0,0,0,0.45),rgba(0,0,0,0.45),url("bgimage.jpg"));
        background-size:cover;
        background-position:center;
        background-repeat:no-repeat;
        }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <center><h1>Welcome to My Travel Website</h1>
        <p>Every Trip Makes Memory</p>
        <br>
        <h3>User Registration</h3>
      </center>
      <center>
      <form>
        <label>First Name:</label>

        <br><br>
        <label>Middle Name:</label>
        <input type="text" name="mname" placeholder="Enter Middle Name">
        <br><br>
        <label>Last Name:</label>
        <input type="text" name="lname" placeholder="Enter Last Name">
        <br><br>
        <label>Contact No.:</label>
        <input type="number" name="contactno" placeholder="Enter Contect No.">
        <br><br>
        <lable>Address:</lable>
        <input type="text" name="address" placeholder="Enter Adress">
        <br><br>
        <lable>Gender:</lable><br>
        <input type="radio">Male<br>
        <input type="radio">Female
        <br><br>
        <button type="submit">Submit</button>
      </form>
      </center>
    </div>
  </body>
</html>

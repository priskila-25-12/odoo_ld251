<html>
  <head>
    <style>
      body{
        background-image:url("img2.jpg");
        background-size:cover;
      }
      *{
        margin:0;
        padding:0%;
        border:none;
        outline:none;
        box-sizing:border-box;
        font-family:"Poppins",sans-serif;
      }
      .sidebar{
        position:sticky;
        top:0;
        left:0;
        bottom:0;
        width:240px;
        height:100vh;
        padding:0 1.7rem;
        color:#ffff;
        overflow:hidden;
        transition:all 0.5s linear;
        background:rgb(113,99,186,255);
      }
      .logo{
        height:80px;
        padding:16px;
      }
      .menu{
        height:88%;
        position:relative;
        list-style:none;
        padding:0;
      }
      .menu li{
        padding:1rem;
        margin:8px 0;
        border-radius:8px;
        transition: all 0.5s ease-in-out;
      }
      .menu li:hover{
        background:#e0e0e058;
      }
      .menu a{
        color:#fff;
        font-size:14px;
        text-decoration:none;
        display:flex;
        align-items:center;
        gap:1.5rem;
      }
      .menu a span{
        overflow:hidden;
      }
      .menu a i{
        font-size:1.2rem;
      }
      .logout{
        position:absolute;
        bottom:0;
        left:0;
        width:100%;
      }
      .bottom{
        justify-content:center;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <center>
        <h1>Welcome To Travel Website</h1>
        <p>Evrery Trip Makes memory</p>
      </center>
    </div>
    <div class="sidebar">
      <div class="logo">
      </div>
    </div>
    <ul clss="menu">
      <li class="active">
        <a href="#">
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a href="#">
          <span>Recent Trips</span>
        </a>
      </li>
      <li>
        <a href="#">
          <span>Recommended Destinations</span>
        </a>
      </li>
      <li>
        <a href="#">
          <span>Budget Highlights</span>
        </a>
      </li>
      <li>
        <a href="#">
         <button type="submit"><span>Plan New Trip</span></button>
        </a>
      </li>
      <li class="logout">
        <a href="#">
          <span>Logout</span>
        </a>
      </li>
    </ul>
  </body>
</html>
